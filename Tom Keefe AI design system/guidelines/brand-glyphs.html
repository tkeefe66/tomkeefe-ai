<!doctype html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>body{margin:0;padding:20px;font-family:var(--font-sans);letter-spacing:var(--track-base);background:var(--bg);color:var(--ink)}.mono{font-family:var(--font-mono)}.g{display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--hair)}.g:last-child{border-bottom:0}.ch{font-size:19px;color:var(--acc);text-align:center}.use{font-size:10px;letter-spacing:0.06em;color:var(--muted)}</style>
</head><body>
<div style="height:1.5px;background:var(--ink)"></div>
<div class="g"><span class="ch">→</span><span class="mono use">ROW LINKS AND CTAS — READ → · EMAIL → · NEXT — INVENTORY →</span></div>
<div class="g"><span class="ch">←</span><span class="mono use">BACK NAVIGATION — ← ALL PROJECTS</span></div>
<div class="g"><span class="ch" style="color:var(--acc-soft)">▾</span><span class="mono use">NAV DROPDOWN, TINTED --ACC-SOFT. ROTATES 180° WHEN OPEN</span></div>
<div class="g"><span class="ch">·</span><span class="mono use">SEPARATOR INSIDE MONO STRINGS — MOPS · REVOPS · GTM</span></div>
<div class="mono" style="margin-top:11px;font-size:10px;letter-spacing:0.06em;color:var(--faint)">NEVER: ICON FONTS, SVG SPRITES, LUCIDE, HEROICONS, EMOJI</div>
</body></html>
