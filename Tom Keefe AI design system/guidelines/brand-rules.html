<!doctype html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>body{margin:0;padding:20px;font-family:var(--font-sans);letter-spacing:var(--track-base);background:var(--bg);color:var(--ink);}
.mono{font-family:var(--font-mono);}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:22px">
<div>
  <div style="height:1.5px;background:var(--ink)"></div><div class="mono" style="margin-top:5px;font-size:10px;color:var(--muted)">1.5PX INK — OPENS A TABLE</div>
  <div style="margin-top:14px;height:1px;background:var(--hair)"></div><div class="mono" style="margin-top:5px;font-size:10px;color:var(--muted)">1PX HAIRLINE — SEPARATES ROWS</div>
</div>
<div style="display:flex;align-items:center;gap:12px">
  <div style="width:44px;height:44px;border:1px solid var(--hair);border-radius:3px"></div>
  <div style="width:44px;height:44px;border:1px solid var(--hair);border-radius:4px"></div>
  <div style="width:64px;height:30px;border:1px solid var(--hair);border-radius:999px"></div>
  <span class="mono" style="font-size:10px;color:var(--muted)">3 · 4 · PILL</span>
</div>
</div></body></html>
