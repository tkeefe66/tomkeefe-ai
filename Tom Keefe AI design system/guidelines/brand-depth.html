<!doctype html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>body{margin:0;padding:20px;font-family:var(--font-sans);letter-spacing:var(--track-base);background:var(--bg);color:var(--ink)}.mono{font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;color:var(--muted)}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;align-items:start}</style>
</head><body><div class="row">
<div>
  <div style="background:var(--bg);border:1px solid var(--hair);border-radius:var(--radius-panel);padding:11px 13px;box-shadow:0 12px 28px rgba(0,0,0,0.14)">
    <div style="font-size:13px;font-weight:600;letter-spacing:-0.02em">B2B MarTech Intel</div>
    <div class="mono" style="margin-top:2px;color:var(--faint)">MARKET INTELLIGENCE</div>
  </div>
  <div class="mono" style="margin-top:9px">NAV DROPDOWN — 0 12PX 28PX RGBA(0,0,0,0.14)</div>
</div>
<div>
  <div style="height:64px;background:var(--sunk);border:1px solid var(--hair);border-radius:var(--radius-panel)"></div>
  <div class="mono" style="margin-top:9px">EVERY OTHER PANEL — FLAT, HAIRLINE ONLY</div>
</div>
<div>
  <div style="height:64px;background:var(--sunk);border:1px solid var(--hair);border-radius:0"></div>
  <div class="mono" style="margin-top:9px">FIGURE PLATE — RADIUS 0, NO SHADOW</div>
</div>
</div>
<div class="mono" style="margin-top:14px;color:var(--faint)">NEVER: CARD SHADOWS, INNER SHADOWS, GLASSMORPHISM, BLUR, GRADIENTS EXCEPT THE PLATE FADE</div>
</body></html>
