<!-- @dsCard group="Colors" viewport="700x150" subtitle="Same roles under data-theme=dark" name="Roles — dark" -->
<!DOCTYPE html><html data-theme="dark"><head><link rel="stylesheet" href="../styles.css"></head>
<body style="display:flex;gap:2px;padding:24px;">
<div style="flex:1;"><div style="height:56px;background:var(--color-bg);border:1px solid var(--color-divider);"></div><div style="font-size:11px;margin-top:6px;">--color-bg<br><span class="text-muted">#201e1d</span></div></div>
<div style="flex:1;"><div style="height:56px;background:var(--color-surface);"></div><div style="font-size:11px;margin-top:6px;">--color-surface<br><span class="text-muted">#2d2b2b</span></div></div>
<div style="flex:1;"><div style="height:56px;background:var(--color-text);"></div><div style="font-size:11px;margin-top:6px;">--color-text<br><span class="text-muted">#f3f2f2</span></div></div>
<div style="flex:1;"><div style="height:56px;background:var(--color-accent);"></div><div style="font-size:11px;margin-top:6px;">--color-accent<br><span class="text-muted">#ff563c</span></div></div>
<div style="flex:1;"><div style="height:56px;background:var(--color-accent-readable);"></div><div style="font-size:11px;margin-top:6px;">--color-accent-readable<br><span class="text-muted">#ff9783</span></div></div>
</body></html>
