<!-- @dsCard group="Colors" viewport="700x150" subtitle="The page is built from seven neutrals. No grays outside this ramp." name="Neutrals" -->
<!doctype html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>body{margin:0;padding:20px;font-family:var(--font-sans);letter-spacing:var(--track-base);background:var(--bg);color:var(--ink);}
.mono{font-family:var(--font-mono);}</style></head><body><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px">
<div style="min-width:0"><div style="height:52px;background:var(--bg);border:1px solid var(--hair);border-radius:2px"></div><div style="margin-top:7px;font-size:12px;font-weight:500">Page</div><div class="mono" style="font-size:10.5px;color:var(--muted)">--bg #FFFFFF</div></div><div style="min-width:0"><div style="height:52px;background:var(--ink);border:1px solid var(--hair);border-radius:2px"></div><div style="margin-top:7px;font-size:12px;font-weight:500">Ink</div><div class="mono" style="font-size:10.5px;color:var(--muted)">--ink #0B0D10</div></div><div style="min-width:0"><div style="height:52px;background:var(--body);border:1px solid var(--hair);border-radius:2px"></div><div style="margin-top:7px;font-size:12px;font-weight:500">Body</div><div class="mono" style="font-size:10.5px;color:var(--muted)">--body #3B424C</div></div><div style="min-width:0"><div style="height:52px;background:var(--muted);border:1px solid var(--hair);border-radius:2px"></div><div style="margin-top:7px;font-size:12px;font-weight:500">Muted</div><div class="mono" style="font-size:10.5px;color:var(--muted)">--muted #6B7280</div></div><div style="min-width:0"><div style="height:52px;background:var(--faint);border:1px solid var(--hair);border-radius:2px"></div><div style="margin-top:7px;font-size:12px;font-weight:500">Faint</div><div class="mono" style="font-size:10.5px;color:var(--muted)">--faint #9AA1AC</div></div><div style="min-width:0"><div style="height:52px;background:var(--hair);border:1px solid var(--hair);border-radius:2px"></div><div style="margin-top:7px;font-size:12px;font-weight:500">Hairline</div><div class="mono" style="font-size:10.5px;color:var(--muted)">--hair #E4E6EA</div></div><div style="min-width:0"><div style="height:52px;background:var(--sunk);border:1px solid var(--hair);border-radius:2px"></div><div style="margin-top:7px;font-size:12px;font-weight:500">Sunk</div><div class="mono" style="font-size:10.5px;color:var(--muted)">--sunk #F7F8F9</div></div>
</div></body></html>
