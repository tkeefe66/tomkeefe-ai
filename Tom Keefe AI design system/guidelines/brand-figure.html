<!-- @dsCard group="Brand" viewport="700x190" subtitle="Screenshots crop at native scale and fade out. Never shrink to fit." name="Figure plates" -->
<!doctype html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>body{margin:0;padding:20px;font-family:var(--font-sans);letter-spacing:var(--track-base);background:var(--bg);color:var(--ink);}
.mono{font-family:var(--font-mono);}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start">
  <div>
    <div style="position:relative;border:1px solid var(--hair);overflow:hidden;height:104px;background:var(--sunk)">
      <div style="width:190%;height:200px;background:repeating-linear-gradient(180deg,var(--tint) 0 22px,transparent 22px 44px)"></div>
      <div style="position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(to bottom,transparent,var(--bg))"></div>
    </div>
    <div class="mono" style="margin-top:7px;font-size:10px;color:var(--acc);letter-spacing:0.06em">FIG. 01 — CROPPED AT 190%, FADED TO PAGE</div>
  </div>
  <div style="font-size:12.5px;line-height:1.55;color:var(--muted)">Sources are ~3300px retina captures. Fit one to the column and the UI renders at 0.27 — illegible. Instead the image runs wider than its container so a real region reads at native scale, and the crop dissolves into the page.</div>
</div></body></html>
