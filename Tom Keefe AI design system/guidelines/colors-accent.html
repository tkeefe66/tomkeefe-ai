<!-- @dsCard group="Colors" viewport="700x150" subtitle="The shipping accent. Deep carries the two full-bleed fields." name="Accent — Navy" -->
<!doctype html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>body{margin:0;padding:20px;font-family:var(--font-sans);letter-spacing:var(--track-base);background:var(--bg);color:var(--ink);}
.mono{font-family:var(--font-mono);}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
<div style="min-width:0"><div style="height:52px;background:var(--acc);border:1px solid var(--hair);border-radius:2px"></div><div style="margin-top:7px;font-size:12px;font-weight:500">Accent</div><div class="mono" style="font-size:10.5px;color:var(--muted)">--acc #1D3A63</div></div><div style="min-width:0"><div style="height:52px;background:var(--acc-hover);border:1px solid var(--hair);border-radius:2px"></div><div style="margin-top:7px;font-size:12px;font-weight:500">Hover</div><div class="mono" style="font-size:10.5px;color:var(--muted)">--acc-hover #152C4C</div></div><div style="min-width:0"><div style="height:52px;background:var(--acc-deep);border:1px solid var(--hair);border-radius:2px"></div><div style="margin-top:7px;font-size:12px;font-weight:500">Deep field</div><div class="mono" style="font-size:10.5px;color:var(--muted)">--acc-deep #152C4B</div></div><div style="min-width:0"><div style="height:52px;background:var(--acc-soft);border:1px solid var(--hair);border-radius:2px"></div><div style="margin-top:7px;font-size:12px;font-weight:500">Soft</div><div class="mono" style="font-size:10.5px;color:var(--muted)">--acc-soft #A6BCD8</div></div><div style="min-width:0"><div style="height:52px;background:var(--tint);border:1px solid var(--hair);border-radius:2px"></div><div style="margin-top:7px;font-size:12px;font-weight:500">Tint</div><div class="mono" style="font-size:10.5px;color:var(--muted)">--tint #E8EDF4</div></div>
</div></body></html>
