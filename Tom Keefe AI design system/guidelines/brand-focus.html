<!-- @dsCard group="Brand" viewport="700x170" subtitle="A 2px --acc ring at 2px offset. Keyboard only, never on click." name="Focus" -->
<!doctype html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>body{margin:0;padding:20px;font-family:var(--font-sans);letter-spacing:var(--track-base);background:var(--bg);color:var(--ink)}
.mono{font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;color:var(--muted)}
.row{display:flex;gap:26px;align-items:center}
.btn{padding:9px 15px;border-radius:var(--radius-button);font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;background:var(--acc);color:var(--acc-ink);border:1px solid var(--acc)}
.ring{outline:2px solid var(--acc);outline-offset:2px}
.ringsoft{outline:2px solid var(--acc-soft);outline-offset:2px}
.onf{background:var(--acc-deep);padding:14px 16px;border-radius:var(--radius-panel);display:flex;gap:22px;align-items:center}
.nv{padding:7px 11px;border-radius:var(--radius-button);font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;color:var(--on-field-strong)}
.skip{padding:9px 15px;border:1px solid var(--acc);border-radius:var(--radius-button);color:var(--acc);font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em}</style>
</head><body>
<div class="row">
  <span class="btn ring">EMAIL</span>
  <span class="skip ring">SKIP TO CONTENT</span>
  <div class="onf"><span class="nv ringsoft">OVERVIEW</span><span class="mono" style="color:var(--on-field-label)">ON A FIELD → --ACC-SOFT</span></div>
</div>
<div class="mono" style="margin-top:14px">:FOCUS-VISIBLE ONLY · OUTLINE 2PX · OFFSET 2PX · RADIUS FOLLOWS THE ELEMENT</div>
<div class="mono" style="margin-top:6px;color:var(--faint)">THE SKIP LINK IS HIDDEN UNTIL FOCUSED. PRESS STATES STAY UNSTYLED.</div>
</body></html>
