<!-- @dsCard group="Colors" viewport="700x320" subtitle="Every word on a deep field is a white alpha, never a solid neutral." name="On-field ramp" -->
<!doctype html>
<html><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>body{margin:0;padding:20px;background:var(--acc-deep);font-family:var(--font-sans);letter-spacing:var(--track-base)}
.r{display:grid;grid-template-columns:190px 1fr 44px;gap:14px;align-items:center;padding:7px 0}
.tok{font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;color:var(--on-field-label)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--on-field-faint);text-align:right}
.s{font-size:14px}</style>
</head><body>
<div class="r"><span class="tok">--ON-FIELD</span><span class="s" style="color:var(--on-field)">Tom Keefe — headings, values</span><span class="val">1.0</span></div>
<div class="r"><span class="tok">--ON-FIELD-STRONG</span><span class="s" style="color:var(--on-field-strong)">Back links, secondary buttons</span><span class="val">.82</span></div>
<div class="r"><span class="tok">--ON-FIELD-BODY</span><span class="s" style="color:var(--on-field-body)">The masthead lead paragraph</span><span class="val">.80</span></div>
<div class="r"><span class="tok">--ON-FIELD-LABEL</span><span class="s" style="color:var(--on-field-label)">ROLE · COMPANY · FIELD</span><span class="val">.60</span></div>
<div class="r"><span class="tok">--ON-FIELD-FAINT</span><span class="s" style="color:var(--on-field-faint)">Footer meta</span><span class="val">.45</span></div>
<div class="r"><span class="tok">--ON-FIELD-RULE-STRONG</span><span style="height:1px;background:var(--on-field-rule-strong)"></span><span class="val">.50</span></div>
<div class="r"><span class="tok">--ON-FIELD-BORDER</span><span style="height:22px;border:1px solid var(--on-field-border);border-radius:var(--radius-button)"></span><span class="val">.36</span></div>
<div class="r"><span class="tok">--ON-FIELD-RULE</span><span style="height:1px;background:var(--on-field-rule)"></span><span class="val">.16</span></div>
<div class="r"><span class="tok">--ON-FIELD-HOVER</span><span style="height:22px;background:var(--on-field-hover);border-radius:var(--radius-button)"></span><span class="val">.09</span></div>
</body></html>
