<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css"></head>
<body style="padding:24px 32px;display:flex;flex-direction:column;gap:20px;">
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
  <button class="btn btn-primary">View projects</button>
  <button class="btn btn-secondary">Email</button>
  <button class="btn btn-ghost">LinkedIn →</button>
  <button class="btn btn-primary" disabled>Disabled</button>
  <button class="btn btn-secondary btn-icon" aria-label="Menu">≡</button>
</div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
  <span class="tag tag-live">Live</span>
  <span class="tag tag-draft">Draft</span>
  <span class="tag tag-draft">In development</span>
  <span class="tag tag-neutral">Internal</span>
  <span class="tag tag-outline">TBC</span>
  <span class="tag tag-accent">AI Agents</span>
</div>
<div style="display:flex;gap:16px;max-width:520px;">
  <div class="field" style="flex:1;"><label for="a">Email</label><input class="input" id="a" placeholder="you@company.com"></div>
  <div class="field" style="flex:1;"><label for="b">Name</label><input class="input" id="b" value="Tom Keefe"></div>
</div>
</body></html>
